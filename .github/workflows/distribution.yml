name: Publish Userscript Distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: userscript-distribution
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build canonical public distribution
        run: uv run --locked python build.py --pages-base https://share-tools.mythic3011.com

      - name: Run full regression suite
        run: uv run --locked bash tests/run.sh

      - name: Determine release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="dist-v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Distribution ${TAG} already exists; leaving the immutable release untouched."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare immutable evidence
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum social-post-tools.user.js social-post-tools.meta.js social-post-tools-v*.user.txt > SHA256SUMS.txt
          VERSION="${{ steps.release.outputs.version }}"
          USER_SHA="$(sha256sum social-post-tools.user.js | awk '{print $1}')"
          cat > release.json <<EOF
          {
            "schema": "social-post-tools-distribution/v1",
            "version": "${VERSION}",
            "distributionTag": "${{ steps.release.outputs.tag }}",
            "sourceCommit": "${GITHUB_SHA}",
            "sha256": "${USER_SHA}"
          }
          EOF
          cat > README.md <<EOF
          # Social Post Tools distribution

          Generated from source commit \`${GITHUB_SHA}\` after the full repository test suite passed.

          - \`social-post-tools.user.js\`: canonical install/update artifact
          - \`social-post-tools.meta.js\`: metadata-only update check
          - \`SHA256SUMS.txt\`: release checksums
          - \`release.json\`: version, immutable distribution tag, source commit, and userscript digest

          Verify a downloaded artifact with:

          \`gh attestation verify social-post-tools.user.js -R mythic3011/social-post-tools\`

          Do not edit this branch manually. Source lives on \`main\`.
          EOF

      - name: Hand off tested distribution
        id: upload
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: userscript-dist-v${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Download tested distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: userscript-dist-v${{ needs.build.outputs.version }}
          path: dist

      - name: Verify handoff checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt

      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Publish generated dist branch and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$(mktemp -d)"
          cp -a dist/. "${export_dir}/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan spt-dist-publish
          git rm -rf .
          git clean -fdx
          cp -a "${export_dir}/." .
          git add -f .
          git commit -m "dist: publish v${{ needs.build.outputs.version }} from ${GITHUB_SHA}"
          DIST_COMMIT="$(git rev-parse HEAD)"
          git push --force origin HEAD:dist
          git tag -a "${{ needs.build.outputs.tag }}" "${DIST_COMMIT}" -m "Userscript distribution v${{ needs.build.outputs.version }}"
          git push origin "refs/tags/${{ needs.build.outputs.tag }}"
