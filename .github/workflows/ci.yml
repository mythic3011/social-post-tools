name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install UI dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync locked Python dependencies
        run: uv sync --locked

      - name: Build
        run: uv run --locked python build.py

      - name: Test
        run: uv run --locked bash tests/run.sh
