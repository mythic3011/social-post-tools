name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages
      - dist
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build
        run: uv run --locked python build.py

      - name: Test
        run: uv run --locked bash tests/run.sh
