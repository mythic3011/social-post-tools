name: Setup Social Post Tools toolchain
description: Install the pinned mise toolchain and locked project dependencies.
runs:
  using: composite
  steps:
    - name: Install verified mise toolchain
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: '2026.9.5'
        cache: true
        install: true

    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        mise --version
        node --version
        python --version
        uv --version

    - name: Install locked project dependencies
      shell: bash
      run: mise run bootstrap
