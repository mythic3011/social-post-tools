<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111111">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'">
  <link rel="manifest" href="./manifest.webmanifest?v=__APP_VERSION__">
  <link rel="stylesheet" href="./assets/vendor/pico.conditional.min.css?v=__APP_VERSION__">
  <link rel="stylesheet" href="./assets/app.css?v=__APP_VERSION__">
  <title>AI capture handoff · Social Post Tools</title>
</head>
<body data-page="capture-handoff">
<div class="pico spt-app">
<main class="container spt-shell">
  <header class="spt-header"><div><h1>AI capture handoff</h1><p class="eyebrow">Browser bridge</p></div><a role="button" class="secondary outline compact" href="./">Home</a></header>

  <article>
    <h2 id="handoff-title">Opening the post…</h2>
    <p id="handoff-note" class="muted">Waiting for the Social Post Tools Userscript in this browser.</p>
    <p class="url" id="handoff-target"></p>
    <div class="toolbar">
      <button id="handoff-copy" type="button" class="secondary">Copy post link</button>
      <a id="handoff-install" role="button" class="secondary outline" href="./install.html">Install Userscript</a>
    </div>
  </article>

  <p id="status" class="status" aria-live="polite"></p>
</main>
</div>
<script src="./social-post-core.js?v=__APP_VERSION__"></script>
<script src="./app.js?v=__APP_VERSION__"></script>
</body>
</html>
