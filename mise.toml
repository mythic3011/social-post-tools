[settings]
minimum_release_age = "7d"
lockfile = true
locked_verify_provenance = true

[tool_config]
locked = true

[tools]
node = "24.20.0"
python = "3.13.15"
"aqua:astral-sh/uv" = "0.12.5"

[tasks.bootstrap]
description = "Install locked project dependencies without lifecycle scripts"
run = [
  "npm ci --ignore-scripts --no-audit --no-fund",
  "uv sync --locked",
]

[tasks.build]
depends = ["bootstrap"]
run = "uv run --locked python build.py"

[tasks.test]
depends = ["bootstrap"]
run = "uv run --locked bash tests/run.sh"

[tasks.check]
depends = ["bootstrap"]
run = [
  "uv run --locked python build.py",
  "uv run --locked bash tests/run.sh",
]
